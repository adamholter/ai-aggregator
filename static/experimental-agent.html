<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experimental Agent — AI Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <style>
        :root {
            --ink: #111827;
            --paper: #ffffff;
            --muted: #6b7280;
            --accent: #3b82f6;
            --border: #e5e7eb;
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--paper);
            color: var(--ink);
            margin: 0;
        }

        .agent-container {
            display: grid;
            grid-template-columns: 1fr 380px;
            min-height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (max-width: 900px) {
            .agent-container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: none;
            }
        }

        .main-area {
            padding: 24px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }

        .sidebar {
            padding: 20px;
            background: #fafafa;
            overflow-y: auto;
            max-height: 100vh;
            position: sticky;
            top: 0;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .badge {
            background: #dbeafe;
            color: #1d4ed8;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 600;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 120px;
        }

        .message {
            margin-bottom: 16px;
            padding: 16px;
            border-radius: 12px;
        }

        .message.user {
            background: #f3f4f6;
            margin-left: 48px;
        }

        .message.assistant {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
        }

        .message.system {
            background: #fef3c7;
            border: 1px solid #fcd34d;
            font-size: 14px;
        }

        .message-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            margin-bottom: 8px;
        }

        /* Activity Log Styles */
        .activity-header {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .activity-header .count {
            background: var(--accent);
            color: white;
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 11px;
        }

        /* Collapsible Tool Step */
        .tool-step {
            margin-bottom: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: white;
            overflow: hidden;
        }

        .tool-step-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
        }

        .tool-step-header:hover {
            background: #f9fafb;
        }

        .tool-step-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .tool-step-dot.pending {
            background: var(--border);
        }

        .tool-step-dot.running {
            background: var(--accent);
            animation: pulse 1.2s infinite;
        }

        .tool-step-dot.done {
            background: var(--success);
        }

        .tool-step-dot.error {
            background: var(--error);
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.6;
                transform: scale(0.9);
            }
        }

        .tool-step-info {
            flex: 1;
            min-width: 0;
        }

        .tool-step-title {
            font-weight: 600;
            font-size: 13px;
            color: var(--ink);
        }

        .tool-step-meta {
            font-size: 11px;
            color: var(--muted);
            margin-top: 2px;
        }

        .tool-step-chevron {
            width: 16px;
            height: 16px;
            color: var(--muted);
            transition: transform 0.2s;
        }

        .tool-step.expanded .tool-step-chevron {
            transform: rotate(180deg);
        }

        .tool-step-content {
            display: none;
            padding: 0 14px 14px;
        }

        .tool-step.expanded .tool-step-content {
            display: block;
        }

        .tool-step-args {
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 11px;
            background: #f3f4f6;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            color: var(--muted);
            margin-bottom: 10px;
        }

        .tool-step-preview {
            font-size: 12px;
            color: var(--ink);
            background: #f9fafb;
            padding: 10px;
            border-radius: 6px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            border: 1px solid var(--border);
        }

        .tool-step-preview-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--paper);
            border-top: 1px solid var(--border);
            padding: 16px;
        }

        .input-wrapper {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
        }

        .input-wrapper input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .input-wrapper button {
            padding: 12px 24px;
            background: var(--ink);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .input-wrapper button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .model-select {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 12px;
            background: white;
            min-width: 180px;
        }

        .prose {
            line-height: 1.6;
            font-size: 14px;
        }

        .prose h2 {
            font-size: 15px;
            font-weight: 600;
            margin: 10px 0 6px;
        }

        .prose ul {
            list-style: disc;
            padding-left: 18px;
        }

        .prose li {
            margin: 3px 0;
        }

        .prose a {
            color: var(--accent);
            text-decoration: underline;
        }

        .back-link {
            color: var(--muted);
            font-size: 13px;
            text-decoration: none;
        }

        .back-link:hover {
            color: var(--ink);
        }

        .empty-state {
            color: var(--muted);
            font-size: 13px;
            text-align: center;
            padding: 32px 16px;
        }
    </style>
</head>

<body>
    <div class="agent-container">
        <div class="main-area">
            <div class="header">
                <div>
                    <a href="/" class="back-link">← Back to Dashboard</a>
                    <h1 class="text-lg font-bold mt-1">Experimental Agent</h1>
                </div>
                <div class="flex items-center gap-3">
                    <span class="badge">Direct Tool Calling</span>
                    <select id="modelSelect" class="model-select">
                        <option value="x-ai/grok-4-fast">Loading...</option>
                    </select>
                </div>
            </div>

            <div id="messages" class="messages">
                <div class="message system">
                    <p><strong>Experimental Agent v2</strong> — Direct OpenRouter tool calling for reliability.</p>
                    <p>Try: "What are the best image models?" or "What's new with Claude?"</p>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="activity-header">
                Agent Activity
                <span class="count" id="stepCount">0</span>
            </div>
            <div id="activityLog"></div>
        </div>
    </div>

    <div class="input-area">
        <form id="chatForm" class="input-wrapper">
            <input type="text" id="questionInput" placeholder="Ask about AI models..." autocomplete="off">
            <button type="submit" id="submitBtn">Send</button>
        </form>
    </div>

    <script>
        const USER_KEY = 'dashboard-user-openrouter-key';
        const MODEL_KEY = 'dashboard-agent-exp-model';
        const MODELS_KEY = 'dashboard-available-models';

        const messagesEl = document.getElementById('messages');
        const form = document.getElementById('chatForm');
        const input = document.getElementById('questionInput');
        const submitBtn = document.getElementById('submitBtn');
        const modelSelect = document.getElementById('modelSelect');
        const activityLog = document.getElementById('activityLog');
        const stepCount = document.getElementById('stepCount');

        let toolSteps = [];

        function getApiKey() {
            return (localStorage.getItem(USER_KEY) || '').trim();
        }

        function formatTime(d) {
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        async function loadModels() {
            const stored = localStorage.getItem(MODELS_KEY) || '';
            let models = stored ? stored.split(',').map(s => s.trim()).filter(Boolean) : [];

            if (!models.length) {
                try {
                    const res = await fetch('/api/model-config');
                    if (res.ok) {
                        const cfg = await res.json();
                        models = (cfg.agent && cfg.agent.availableModels) || [];
                    }
                } catch (_) { }
            }

            if (!models.length) {
                models = ['x-ai/grok-4-fast', 'anthropic/claude-sonnet-4', 'openai/gpt-4.1', 'google/gemini-2.5-flash'];
            }

            modelSelect.innerHTML = models.map(id =>
                `<option value="${id}">${id.split('/').pop()}</option>`
            ).join('');

            const saved = localStorage.getItem(MODEL_KEY);
            if (saved && models.includes(saved)) modelSelect.value = saved;
        }

        modelSelect.addEventListener('change', () => {
            localStorage.setItem(MODEL_KEY, modelSelect.value);
        });

        function renderMarkdown(content) {
            if (typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined') {
                return DOMPurify.sanitize(marked.parse(content || ''));
            }
            return content;
        }

        function addMessage(role, content) {
            const msg = document.createElement('div');
            msg.className = `message ${role}`;
            msg.innerHTML = `
        <div class="message-label">${role === 'user' ? 'You' : role === 'assistant' ? 'Agent' : 'System'}</div>
        <div class="prose">${renderMarkdown(content)}</div>
      `;
            messagesEl.appendChild(msg);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function addToolStep(title, status = 'running', args = null, result = null) {
            const step = {
                id: Date.now(),
                title,
                status,
                args,
                result,
                time: new Date(),
                expanded: false
            };
            toolSteps.push(step);
            renderActivityLog();
            return step;
        }

        function updateToolStep(stepId, updates) {
            const step = toolSteps.find(s => s.id === stepId);
            if (step) {
                Object.assign(step, updates);
                renderActivityLog();
            }
        }

        function renderActivityLog() {
            stepCount.textContent = toolSteps.length;

            if (!toolSteps.length) {
                activityLog.innerHTML = '<div class="empty-state">Waiting for activity...</div>';
                return;
            }

            activityLog.innerHTML = toolSteps.map(step => `
        <div class="tool-step ${step.expanded ? 'expanded' : ''}" data-id="${step.id}">
          <div class="tool-step-header" onclick="toggleStep(${step.id})">
            <div class="tool-step-dot ${step.status}"></div>
            <div class="tool-step-info">
              <div class="tool-step-title">${escapeHtml(step.title)}</div>
              <div class="tool-step-meta">${formatTime(step.time)}</div>
            </div>
            <svg class="tool-step-chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </div>
          <div class="tool-step-content">
            ${step.args ? `
              <div class="tool-step-preview-label">Arguments</div>
              <div class="tool-step-args">${escapeHtml(JSON.stringify(step.args, null, 2))}</div>
            ` : ''}
            ${step.result ? `
              <div class="tool-step-preview-label">Result Preview</div>
              <div class="tool-step-preview">${escapeHtml(step.result.slice(0, 800))}${step.result.length > 800 ? '...' : ''}</div>
            ` : ''}
          </div>
        </div>
      `).join('');
        }

        window.toggleStep = function (id) {
            const step = toolSteps.find(s => s.id === id);
            if (step) {
                step.expanded = !step.expanded;
                renderActivityLog();
            }
        };

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const question = input.value.trim();
            if (!question) return;

            const apiKey = getApiKey();
            if (!apiKey) {
                addMessage('system', '⚠️ Add your OpenRouter API key in Settings on the main dashboard.');
                return;
            }

            // Reset
            toolSteps = [];
            renderActivityLog();

            addMessage('user', question);
            input.value = '';
            submitBtn.disabled = true;

            const initStep = addToolStep('Starting agent', 'running');

            try {
                const response = await fetch('/api/experimental-agent', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        question: question,
                        model: modelSelect.value
                    })
                });

                // Check for HTML error page
                const contentType = response.headers.get('content-type') || '';
                if (contentType.includes('text/html')) {
                    throw new Error(`Server error (${response.status}). Try refreshing.`);
                }

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                updateToolStep(initStep.id, { status: 'done', title: 'Agent initialized' });

                // Show tool calls
                if (data.tool_calls && data.tool_calls.length) {
                    data.tool_calls.forEach(tc => {
                        addToolStep(
                            `Tool: ${tc.tool}`,
                            tc.status || 'done',
                            tc.args,
                            tc.result
                        );
                    });
                }

                addToolStep('Response ready', 'done');

                if (data.response) {
                    addMessage('assistant', data.response);
                } else {
                    addMessage('system', 'Agent returned no response.');
                }

            } catch (error) {
                console.error('Agent error:', error);
                updateToolStep(initStep.id, { status: 'error', title: error.message });
                addMessage('system', `Error: ${error.message}`);
            } finally {
                submitBtn.disabled = false;
                input.focus();
            }
        });

        loadModels();
        if (!getApiKey()) {
            addMessage('system', '⚠️ Add your OpenRouter API key in Settings, then reload.');
        }
    </script>
</body>

</html>
