<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experimental Agent — AI Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <style>
        :root {
            color-scheme: light;
            --ink: #111827;
            --paper: #ffffff;
            --muted: #6b7280;
            --accent: #3b82f6;
            --border: #e5e7eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--paper);
            color: var(--ink);
        }

        .agent-container {
            display: grid;
            grid-template-columns: 1fr 320px;
            min-height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (max-width: 900px) {
            .agent-container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: none;
            }
        }

        .main-area {
            padding: 24px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }

        .sidebar {
            padding: 24px;
            background: #fafafa;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .badge {
            background: #fef3c7;
            color: #92400e;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 100px;
        }

        .message {
            margin-bottom: 16px;
            padding: 16px;
            border-radius: 12px;
        }

        .message.user {
            background: #f3f4f6;
            margin-left: 48px;
        }

        .message.assistant {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
        }

        .message.system {
            background: #fef3c7;
            border: 1px solid #fcd34d;
            font-size: 14px;
        }

        .message-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            margin-bottom: 8px;
        }

        /* Stack trace / activity log */
        .activity-header {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            margin-bottom: 16px;
        }

        .timeline {
            position: relative;
        }

        .timeline-item {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            position: relative;
        }

        .timeline-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--border);
            flex-shrink: 0;
            margin-top: 4px;
        }

        .timeline-dot.running {
            background: var(--accent);
            animation: pulse 1.5s infinite;
        }

        .timeline-dot.done {
            background: #10b981;
        }

        .timeline-dot.error {
            background: #ef4444;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .timeline-content {
            flex: 1;
        }

        .timeline-title {
            font-weight: 600;
            font-size: 13px;
            color: var(--ink);
        }

        .timeline-detail {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }

        .timeline-preview {
            font-size: 11px;
            color: var(--muted);
            background: white;
            padding: 8px;
            border-radius: 6px;
            margin-top: 6px;
            border: 1px solid var(--border);
            max-height: 100px;
            overflow: hidden;
        }

        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--paper);
            border-top: 1px solid var(--border);
            padding: 16px;
        }

        .input-wrapper {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
        }

        .input-wrapper input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .input-wrapper button {
            padding: 12px 24px;
            background: var(--ink);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .input-wrapper button:hover {
            background: #374151;
        }

        .input-wrapper button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .model-select {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 13px;
            background: white;
            min-width: 200px;
        }

        .prose {
            line-height: 1.6;
        }

        .prose h2 {
            font-size: 16px;
            font-weight: 600;
            margin: 12px 0 6px;
        }

        .prose ul {
            list-style: disc;
            padding-left: 20px;
        }

        .prose li {
            margin: 4px 0;
        }

        .prose a {
            color: var(--accent);
            text-decoration: underline;
        }

        .prose code {
            background: #f3f4f6;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
        }

        .back-link {
            color: var(--muted);
            font-size: 14px;
            text-decoration: none;
        }

        .back-link:hover {
            color: var(--ink);
        }

        .empty-state {
            color: var(--muted);
            font-size: 13px;
            text-align: center;
            padding: 32px;
        }
    </style>
</head>

<body>
    <div class="agent-container">
        <div class="main-area">
            <div class="header">
                <div>
                    <a href="/" class="back-link">← Back to Dashboard</a>
                    <h1 class="text-xl font-bold mt-1">Experimental Agent</h1>
                </div>
                <div class="flex items-center gap-3">
                    <span class="badge">Pydantic AI</span>
                    <select id="modelSelect" class="model-select">
                        <option value="x-ai/grok-4-fast">Loading models...</option>
                    </select>
                </div>
            </div>

            <div id="messages" class="messages">
                <div class="message system">
                    <p><strong>Experimental Agent</strong> — Uses Pydantic AI for typed tool calling.</p>
                    <p>Try: "What's the best image model?" or "What's new with Gemini?"</p>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="activity-header">Agent Activity</div>
            <div id="activityLog" class="timeline">
                <div class="empty-state">Waiting for a question...</div>
            </div>
        </div>
    </div>

    <div class="input-area">
        <form id="chatForm" class="input-wrapper">
            <input type="text" id="questionInput" placeholder="Ask about AI models and news..." autocomplete="off">
            <button type="submit" id="submitBtn">Send</button>
        </form>
    </div>

    <script>
        const USER_OPENROUTER_KEY_STORAGE = 'dashboard-user-openrouter-key';
        const AGENT_MODEL_STORAGE = 'dashboard-agent-exp-model';
        const AVAILABLE_MODELS_STORAGE = 'dashboard-available-models';

        const messagesContainer = document.getElementById('messages');
        const chatForm = document.getElementById('chatForm');
        const questionInput = document.getElementById('questionInput');
        const submitBtn = document.getElementById('submitBtn');
        const modelSelect = document.getElementById('modelSelect');
        const activityLog = document.getElementById('activityLog');

        let currentTrace = [];

        function getApiKey() {
            return (localStorage.getItem(USER_OPENROUTER_KEY_STORAGE) || '').trim();
        }

        function formatTime(date) {
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        // Load models from settings (same as main agent)
        async function loadModels() {
            const stored = localStorage.getItem(AVAILABLE_MODELS_STORAGE) || '';
            const storedList = stored ? stored.split(',').map(s => s.trim()).filter(Boolean) : [];
            const savedModel = localStorage.getItem(AGENT_MODEL_STORAGE);

            let models = storedList;

            // If no stored models, try to fetch from config
            if (!models.length) {
                try {
                    const res = await fetch('/api/model-config');
                    if (res.ok) {
                        const cfg = await res.json();
                        models = (cfg.agent && cfg.agent.availableModels) || [];
                    }
                } catch (_) { }
            }

            // Fallback defaults
            if (!models.length) {
                models = [
                    'x-ai/grok-4-fast',
                    'anthropic/claude-sonnet-4',
                    'openai/gpt-4.1',
                    'google/gemini-2.5-flash'
                ];
            }

            modelSelect.innerHTML = '';
            models.forEach(id => {
                const opt = document.createElement('option');
                opt.value = id;
                opt.textContent = id.split('/').pop();
                modelSelect.appendChild(opt);
            });

            // Restore saved selection
            if (savedModel && models.includes(savedModel)) {
                modelSelect.value = savedModel;
            }
        }

        modelSelect.addEventListener('change', () => {
            localStorage.setItem(AGENT_MODEL_STORAGE, modelSelect.value);
        });

        function renderMarkdown(content) {
            if (typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined') {
                return DOMPurify.sanitize(marked.parse(content || ''));
            }
            return content;
        }

        function addMessage(role, content) {
            const msg = document.createElement('div');
            msg.className = `message ${role}`;

            const label = document.createElement('div');
            label.className = 'message-label';
            label.textContent = role === 'user' ? 'You' : role === 'assistant' ? 'Agent' : 'System';
            msg.appendChild(label);

            const body = document.createElement('div');
            body.className = 'prose';
            body.innerHTML = renderMarkdown(content);
            msg.appendChild(body);

            messagesContainer.appendChild(msg);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            return msg;
        }

        function addTraceStep(title, detail, status = 'running', preview = '') {
            const step = { title, detail, status, preview, created: new Date() };
            currentTrace.push(step);
            renderActivityLog();
            return step;
        }

        function updateTraceStep(index, updates) {
            if (currentTrace[index]) {
                Object.assign(currentTrace[index], updates);
                renderActivityLog();
            }
        }

        function renderActivityLog() {
            if (!currentTrace.length) {
                activityLog.innerHTML = '<div class="empty-state">Waiting for a question...</div>';
                return;
            }

            activityLog.innerHTML = currentTrace.map(step => `
        <div class="timeline-item">
          <div class="timeline-dot ${step.status}"></div>
          <div class="timeline-content">
            <div class="timeline-title">${step.title}</div>
            <div class="timeline-detail">${formatTime(step.created)} — ${step.detail}</div>
            ${step.preview ? `<div class="timeline-preview">${step.preview}</div>` : ''}
          </div>
        </div>
      `).join('');
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const question = questionInput.value.trim();
            if (!question) return;

            const apiKey = getApiKey();
            if (!apiKey) {
                addMessage('system', '⚠️ No OpenRouter API key. Add your key in Settings on the main dashboard.');
                return;
            }

            // Reset trace
            currentTrace = [];

            // Add user message
            addMessage('user', question);
            questionInput.value = '';
            submitBtn.disabled = true;

            // Start trace
            const initStep = addTraceStep('Initializing', 'Preparing agent request...', 'running');

            try {
                // Use streaming endpoint for live updates
                const response = await fetch('/api/experimental-agent/stream', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        question: question,
                        model: modelSelect.value
                    })
                });

                if (!response.ok) {
                    // Check if response is HTML (404/error page)
                    const contentType = response.headers.get('content-type') || '';
                    if (contentType.includes('text/html')) {
                        throw new Error(`Server returned HTML (status ${response.status}). The experimental agent may not be deployed yet.`);
                    }
                    const err = await response.json().catch(() => ({ error: `HTTP ${response.status}` }));
                    throw new Error(err.error || `Request failed: ${response.status}`);
                }

                updateTraceStep(0, { status: 'done', detail: 'Agent ready' });

                const toolStep = addTraceStep('Calling tools', 'Fetching data...', 'running');

                // Read SSE stream
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const event = JSON.parse(line.slice(6));

                                if (event.type === 'text') {
                                    fullText += event.content;
                                    updateTraceStep(1, { detail: `Receiving response...` });
                                } else if (event.type === 'tool_call') {
                                    addTraceStep(`Tool: ${event.tool}`, JSON.stringify(event.args || {}), 'done');
                                } else if (event.type === 'error') {
                                    throw new Error(event.error);
                                } else if (event.type === 'done') {
                                    fullText = event.response || fullText;
                                }
                            } catch (parseErr) {
                                console.warn('SSE parse error:', parseErr);
                            }
                        }
                    }
                }

                updateTraceStep(1, { status: 'done', detail: 'Response complete' });
                addTraceStep('Done', 'Agent finished', 'done');

                if (fullText) {
                    addMessage('assistant', fullText);
                } else {
                    addMessage('system', 'No response received from agent.');
                }

            } catch (error) {
                console.error('Agent error:', error);
                updateTraceStep(currentTrace.length - 1, { status: 'error', detail: error.message });
                addMessage('system', `Error: ${error.message}`);
            } finally {
                submitBtn.disabled = false;
                questionInput.focus();
            }
        });

        // Initialize
        loadModels();

        if (!getApiKey()) {
            addMessage('system', '⚠️ No OpenRouter API key. Add your key in Settings on the main dashboard, then reload.');
        }
    </script>
</body>

</html>
