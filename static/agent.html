<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Agent</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #ffffff;
  --bg-2: #f3f4f6;
  --surface: #f9fafb;
  --border: #e5e7eb;
  --border-strong: #d1d5db;
  --text: #111111;
  --text-2: #6b7280;
  --text-3: #9ca3af;
  --user-bg: #111111;
  --user-text: #ffffff;
  --accent: #111111;
  --blue: #2563eb;
  --blue-bg: #eff6ff;
  --blue-border: #bfdbfe;
  --green: #16a34a;
  --green-bg: #f0fdf4;
  --red: #dc2626;
  --red-bg: #fef2f2;
  --red-border: #fecaca;
}

[data-theme="dark"] {
  --bg: #0c0c0e;
  --bg-2: #1e1e22;
  --surface: #17171a;
  --border: #2a2a2e;
  --border-strong: #3c3c42;
  --text: #e8e8ea;
  --text-2: #a0a0a8;
  --text-3: #606068;
  --user-bg: #e8e8ea;
  --user-text: #0c0c0e;
  --accent: #e8e8ea;
  --blue: #60a5fa;
  --blue-bg: #1e2a3a;
  --blue-border: #2d4a6e;
  --green: #4ade80;
  --green-bg: #0f2018;
  --red: #f87171;
  --red-bg: #2a1010;
  --red-border: #5c2020;
}

html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

#app { display: flex; flex-direction: column; height: 100vh; max-height: 100vh; }

#header {
  display: flex; align-items: center; padding: 0 14px;
  height: 46px; border-bottom: 1px solid var(--border);
  gap: 8px; flex-shrink: 0; background: var(--bg);
}
.header-brand { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
.header-spacer { flex: 1; }

#model-select {
  border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px;
  font-size: 12px; color: var(--text); background: var(--bg);
  cursor: pointer; outline: none; font-family: inherit; max-width: 200px;
}
#model-select:focus { border-color: var(--accent); }

button.icon-btn, a.icon-btn {
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--border); border-radius: 6px; background: var(--bg);
  cursor: pointer; color: var(--text-2); flex-shrink: 0; text-decoration: none;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
}
button.icon-btn:hover, a.icon-btn:hover { background: var(--surface); border-color: var(--border-strong); color: var(--text); }
.icon-btn svg { width: 15px; height: 15px; }

#settings-bar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 10px 14px; display: flex; gap: 10px; align-items: center; flex-shrink: 0;
}
#settings-bar.hidden { display: none; }
.settings-label { font-size: 12px; color: var(--text-2); white-space: nowrap; }

#api-key-input {
  flex: 1; border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 10px; font-size: 12px; font-family: inherit;
  outline: none; background: var(--bg); min-width: 0;
}
#api-key-input:focus { border-color: var(--accent); }

.toggle-wrap {
  display: flex; align-items: center; gap: 5px; cursor: pointer;
  font-size: 12px; color: var(--text-2); user-select: none; white-space: nowrap;
}
.toggle-wrap input { cursor: pointer; }

#messages {
  flex: 1; overflow-y: auto; padding: 20px 16px 8px;
  display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth;
  align-items: stretch;
}

/* Center chat content on wide screens */
.msg-user, .msg-agent, #empty-state, .loading-row {
  max-width: 760px; width: 100%; align-self: center;
}

@media (min-width: 840px) {
  #input-area { padding-left: max(14px, calc(50% - 380px)); padding-right: max(14px, calc(50% - 380px)); }
  #header { padding-left: max(14px, calc(50% - 380px + 0px)); padding-right: max(14px, calc(50% - 380px + 0px)); }
  #settings-bar { padding-left: max(14px, calc(50% - 380px)); padding-right: max(14px, calc(50% - 380px)); }
}

#empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 6px; padding: 40px 20px;
  text-align: center; flex: 1;
}
#empty-state h2 { font-size: 16px; font-weight: 600; }
#empty-state p { font-size: 13px; color: var(--text-2); max-width: 320px; line-height: 1.6; }
.suggestions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 16px; }
.suggestion {
  border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px;
  font-size: 12px; color: var(--text-2); cursor: pointer; background: var(--bg);
  font-family: inherit; transition: all 0.12s; line-height: 1.4;
}
.suggestion:hover { border-color: var(--accent); color: var(--text); background: var(--surface); }

.msg-user { display: flex; justify-content: flex-end; }
.user-bubble {
  background: var(--user-bg); color: var(--user-text);
  padding: 9px 14px; border-radius: 16px 16px 3px 16px;
  max-width: 72%; font-size: 14px; line-height: 1.55;
  white-space: pre-wrap; word-break: break-word;
}

.msg-agent { display: flex; flex-direction: column; gap: 10px; }

.trace-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px 5px 10px; border: 1px solid var(--border); border-radius: 20px;
  font-size: 12px; color: var(--text-2); cursor: pointer; background: var(--bg);
  user-select: none; transition: all 0.12s; align-self: flex-start; font-family: inherit;
}
.trace-pill:hover { border-color: var(--border-strong); color: var(--text); background: var(--surface); }
.trace-pill svg { width: 13px; height: 13px; flex-shrink: 0; }
.trace-chevron { transition: transform 0.2s ease; }
.trace-pill.open .trace-chevron { transform: rotate(90deg); }

.trace-items {
  display: none; flex-direction: column;
  border: 1px solid var(--border); border-radius: 10px;
  overflow: hidden; background: var(--surface);
}
.trace-items.visible { display: flex; }

.trace-row { display: flex; flex-direction: column; border-bottom: 1px solid var(--border); }
.trace-row:last-child { border-bottom: none; }

.trace-row-header {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  cursor: pointer; transition: background 0.1s;
}
.trace-row-header:hover { background: rgba(0,0,0,0.03); }

.trace-row-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.trace-row-icon svg { width: 14px; height: 14px; }

.trace-row-label { flex: 1; font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trace-row-query { font-weight: 500; color: var(--text); }
.trace-row-sub { color: var(--text-2); }

.trace-row-badge {
  font-size: 11px; color: var(--green); background: var(--green-bg);
  padding: 1px 7px; border-radius: 10px; flex-shrink: 0;
}
.trace-row-badge.err { color: var(--red); background: var(--red-bg); }

.trace-expand { padding: 2px; color: var(--text-3); flex-shrink: 0; transition: transform 0.15s; display: flex; }
.trace-expand svg { width: 12px; height: 12px; }
.trace-row.open .trace-expand { transform: rotate(90deg); }

.trace-row-detail {
  display: none; padding: 10px 12px 12px 40px;
  font-size: 11px; color: var(--text-2);
  font-family: 'SF Mono', 'Fira Code', 'Menlo', monospace;
  white-space: pre-wrap; word-break: break-word; line-height: 1.6;
  border-top: 1px solid var(--border); background: var(--bg);
  max-height: 200px; overflow-y: auto;
}
.trace-row.open .trace-row-detail { display: block; }

.agent-response { font-size: 14px; line-height: 1.7; color: var(--text); min-width: 0; }

.agent-response h1 { font-size: 18px; font-weight: 700; margin: 20px 0 10px; line-height: 1.3; }
.agent-response h2 { font-size: 16px; font-weight: 600; margin: 16px 0 8px; line-height: 1.3; }
.agent-response h3 { font-size: 14px; font-weight: 600; margin: 14px 0 6px; line-height: 1.3; }
.agent-response h1:first-child, .agent-response h2:first-child, .agent-response h3:first-child { margin-top: 0; }
.agent-response p { margin-bottom: 10px; }
.agent-response p:last-child { margin-bottom: 0; }
.agent-response ul, .agent-response ol { padding-left: 20px; margin-bottom: 10px; }
.agent-response li { margin-bottom: 3px; line-height: 1.6; }
.agent-response strong { font-weight: 600; }
.agent-response a { color: var(--blue); text-decoration: none; }
.agent-response a:hover { text-decoration: underline; }
.agent-response hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
.agent-response blockquote { border-left: 3px solid var(--border-strong); padding-left: 12px; color: var(--text-2); margin: 10px 0; }
.agent-response code {
  background: var(--surface); border: 1px solid var(--border); padding: 1px 5px;
  border-radius: 4px; font-family: 'SF Mono','Fira Code','Menlo',monospace; font-size: 12px;
}
.agent-response pre {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 14px; overflow-x: auto; margin: 10px 0;
}
.agent-response pre code { background: none; border: none; padding: 0; font-size: 12px; line-height: 1.6; }
.agent-response table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; }
.agent-response th {
  background: var(--surface); padding: 8px 12px; text-align: left;
  border: 1px solid var(--border); font-weight: 600; font-size: 12px;
  color: var(--text-2); text-transform: uppercase; letter-spacing: 0.03em;
}
.agent-response td { padding: 7px 12px; border: 1px solid var(--border); }
.agent-response tr:nth-child(even) td { background: var(--surface); }

.chart-wrap { position: relative; margin: 12px 0; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; height: 300px; }
.chart-wrap canvas { display: block; }
/* ── Trace Sidebar ─────────────────────────────────────────────── */
.trace-sidebar-backdrop {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.18);
  opacity: 0; pointer-events: none;
  transition: opacity 0.22s ease;
}
.trace-sidebar-backdrop.open { opacity: 1; pointer-events: auto; }

.trace-sidebar {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 201;
  width: 400px; max-width: calc(100vw - 40px);
  background: var(--bg);
  border-left: 1px solid var(--border-strong);
  box-shadow: -16px 0 48px rgba(0,0,0,0.07);
  display: flex; flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.26s cubic-bezier(0.4, 0, 0.2, 1);
}
.trace-sidebar.open { transform: translateX(0); }

.tsb-head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px 13px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  background: var(--surface);
}
.tsb-head-text { flex: 1; display: flex; align-items: baseline; gap: 7px; }
.tsb-head-title { font-size: 13px; font-weight: 650; letter-spacing: -0.01em; }
.tsb-head-meta { font-size: 11px; color: var(--text-3); }
.tsb-close {
  width: 26px; height: 26px;
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2); flex-shrink: 0; font-size: 14px;
  font-family: inherit; line-height: 1; transition: background 0.1s, color 0.1s;
}
.tsb-close:hover { background: var(--bg-2); color: var(--text); }

.tsb-body {
  flex: 1; overflow-y: auto;
  padding: 6px 0;
}
.tsb-empty {
  padding: 24px 20px;
  font-size: 12px; color: var(--text-3);
  text-align: center;
}

.tsb-step {
  display: flex; align-items: stretch;
  cursor: pointer;
  transition: background 0.1s;
  border-bottom: 1px solid var(--border);
}
.tsb-step:last-child { border-bottom: none; }
.tsb-step:hover { background: var(--surface); }

.tsb-gutter {
  width: 44px; flex-shrink: 0;
  display: flex; flex-direction: column;
  align-items: center;
  padding-top: 14px;
  position: relative;
}
.tsb-gutter::after {
  content: ''; position: absolute;
  left: 50%; top: 26px; bottom: 0;
  width: 1px; background: var(--border);
  transform: translateX(-50%);
}
.tsb-step:last-child .tsb-gutter::after { display: none; }

.tsb-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--border-strong); flex-shrink: 0;
  position: relative; z-index: 1;
  transition: background 0.2s;
}
.tsb-dot.done { background: var(--green); }
.tsb-dot.err  { background: var(--red); }

.tsb-content {
  flex: 1; padding: 10px 16px 10px 4px; min-width: 0;
}
.tsb-row-main {
  display: flex; align-items: center; gap: 6px;
}
.tsb-name {
  flex: 1; font-size: 12px; font-weight: 500; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tsb-badge {
  font-size: 10px; font-weight: 600; color: var(--green);
  flex-shrink: 0;
}
.tsb-badge.err { color: var(--red); }
.tsb-chevron {
  width: 12px; height: 12px; color: var(--text-3);
  transition: transform 0.15s ease; flex-shrink: 0;
}
.tsb-step.open .tsb-chevron { transform: rotate(90deg); }

.tsb-sub {
  font-size: 11px; color: var(--text-3); margin-top: 2px;
}
.tsb-detail {
  margin-top: 8px; padding: 9px 11px;
  background: var(--bg);
  border: 1px solid var(--border); border-radius: 7px;
  font-size: 10.5px; font-family: 'SF Mono','Fira Code','Menlo',monospace;
  white-space: pre-wrap; word-break: break-word;
  color: var(--text-2); max-height: 200px; overflow-y: auto;
  line-height: 1.55; display: none;
}
.tsb-step.open .tsb-detail { display: block; }

@media (max-width: 520px) {
  .trace-sidebar { width: 100%; max-width: 100%; }
}

/* ── Live Trace enhancements ─────────────────────────────────── */
.loading-row { cursor: pointer; }
.live-hint { font-size: 12px; color: var(--text-3); margin-left: 8px; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 2px; }
.loading-row:hover .live-hint { color: var(--text-2); }
.tsb-dot.running { background: var(--blue); animation: dotpulse 1s ease-in-out infinite; }
.tsb-head-live { display: inline-block; font-size: 10px; font-weight: 700; color: var(--blue); text-transform: uppercase; letter-spacing: .06em; background: var(--blue-bg); border: 1px solid var(--blue-border); padding: 1px 5px; border-radius: 4px; }

/* ── Artifact Panel ──────────────────────────────────────────── */
.artifact-backdrop {
  position: fixed; inset: 0; z-index: 202;
  background: rgba(0,0,0,0.2);
  opacity: 0; pointer-events: none;
  transition: opacity 0.22s ease;
}
.artifact-backdrop.open { opacity: 1; pointer-events: auto; }

.artifact-panel {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 203;
  width: 580px; max-width: calc(100vw - 48px);
  background: var(--bg);
  border-left: 1px solid var(--border-strong);
  box-shadow: -20px 0 60px rgba(0,0,0,0.1);
  display: flex; flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
}
.artifact-panel.open { transform: translateX(0); }

.artifact-head {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px 10px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface); flex-shrink: 0;
}
.artifact-head-left { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
.artifact-type-badge {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .07em; padding: 2px 6px; border-radius: 4px;
  background: var(--blue-bg); color: var(--blue); border: 1px solid var(--blue-border);
  flex-shrink: 0;
}
.artifact-title { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.artifact-head-actions { display: flex; align-items: center; gap: 4px; }
.artifact-btn {
  padding: 4px 10px; font-size: 11px; font-weight: 500;
  border: 1px solid var(--border); border-radius: 5px;
  background: var(--bg); color: var(--text-2); cursor: pointer;
  line-height: 1.5; transition: background 0.12s, color 0.12s, border-color 0.12s;
  font-family: inherit;
}
.artifact-btn:hover { background: var(--bg-2); color: var(--text); }
.artifact-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.artifact-btn.success { color: var(--green); border-color: var(--green); }
.artifact-close {
  width: 26px; height: 26px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); cursor: pointer; display: flex; align-items: center;
  justify-content: center; color: var(--text-2); flex-shrink: 0;
  transition: background 0.1s, color 0.1s; margin-left: 4px;
}
.artifact-close:hover { background: var(--bg-2); color: var(--text); }
.artifact-body { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
.artifact-iframe { width: 100%; height: 100%; border: none; flex: 1; display: block; }
.artifact-source-view {
  flex: 1; overflow-y: auto; padding: 16px 20px;
  font-family: 'SF Mono','Fira Code','Menlo',monospace;
  font-size: 12px; line-height: 1.65; color: var(--text);
  white-space: pre-wrap; word-break: break-word;
  background: var(--surface);
}
.artifact-markdown-view { flex: 1; overflow-y: auto; padding: 20px 24px; }
.artifact-svg-view {
  flex: 1; overflow: auto; display: flex; align-items: center;
  justify-content: center; padding: 20px; background: var(--surface);
}
.artifact-svg-view svg { max-width: 100%; max-height: 100%; height: auto; }
.artifact-chart-wrap { flex: 1; padding: 20px; position: relative; }
.artifact-chart-wrap canvas { position: absolute; inset: 20px; }

/* Inline artifact reference — subtle text link in message stream */
.artifact-card {
  display: inline-flex; align-items: center; gap: 6px;
  margin: 6px 0; cursor: pointer;
  background: none; border: none; padding: 0;
  color: var(--text); font-family: inherit; font-size: 13px;
  max-width: 400px;
}
.artifact-card:hover .artifact-card-title { text-decoration-style: solid; }
.artifact-card-icon { color: var(--text-2); flex-shrink: 0; transition: color 0.12s; }
.artifact-card:hover .artifact-card-icon { color: var(--text); }
.artifact-card-type {
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .06em; color: var(--text-3); flex-shrink: 0;
}
.artifact-card-title {
  color: var(--text); font-weight: 500;
  text-decoration: underline; text-decoration-style: dotted;
  text-underline-offset: 3px; text-decoration-color: var(--border-strong);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  transition: text-decoration-color 0.12s;
}
.artifact-card:hover .artifact-card-title { text-decoration-color: var(--text); }

.model-badge {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--blue-bg); border: 1px solid var(--blue-border);
  color: var(--blue); padding: 2px 8px; border-radius: 4px;
  font-size: 11px; font-weight: 500; vertical-align: middle;
  cursor: pointer; transition: background 0.12s, border-color 0.12s;
  font-family: inherit; line-height: 1.4;
}
.model-badge:hover { background: var(--blue-bg); border-color: var(--blue-border); filter: brightness(0.95); }

/* Model carousel */
.model-carousel-wrap { position: relative; }
.model-carousel {
  display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 8px;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.model-carousel::-webkit-scrollbar { display: none; }
.carousel-arrow {
  position: absolute; top: 50%; transform: translateY(-60%);
  width: 26px; height: 26px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--bg);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: var(--text-2); z-index: 2;
  opacity: 0; pointer-events: none;
  transition: opacity 0.15s;
}
.carousel-arrow:hover { background: var(--bg-2); color: var(--text); }
.carousel-arrow.left  { left: -13px; }
.carousel-arrow.right { right: -13px; }
.model-carousel-wrap:hover .carousel-arrow.visible { opacity: 1; pointer-events: auto; }

.model-mini-card {
  flex-shrink: 0; width: 180px;
  border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 12px; cursor: pointer; background: var(--bg);
  transition: border-color 0.12s, box-shadow 0.12s;
}
.model-mini-card:hover { border-color: var(--border-strong); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.model-mini-name { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.model-mini-source { font-size: 11px; color: var(--text-3); margin-bottom: 6px; }
.model-mini-summary { font-size: 11px; color: var(--text-2); line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.model-mini-loading { font-size: 11px; color: var(--text-3); font-style: italic; }

/* Model page modal */
#model-modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000;
  display: none; align-items: center; justify-content: center; padding: 20px;
}
#model-modal-overlay.open { display: flex; }
#model-modal {
  background: var(--bg); border-radius: 14px; width: 100%; max-width: 560px;
  max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  display: flex; flex-direction: column;
}
.modal-header {
  padding: 16px 18px 14px; border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; gap: 10px; flex-shrink: 0;
}
.modal-header h2 { font-size: 16px; font-weight: 700; flex: 1; line-height: 1.3; }
.modal-close {
  width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); cursor: pointer; display: flex; align-items: center;
  justify-content: center; color: var(--text-2); flex-shrink: 0; font-size: 16px;
  font-family: inherit; line-height: 1; transition: background 0.1s;
}
.modal-close:hover { background: var(--surface); }
.modal-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.modal-summary { font-size: 13px; color: var(--text); line-height: 1.7; }
.modal-section { display: flex; flex-direction: column; gap: 6px; }
.modal-section-title { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.05em; }
.modal-row { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; border-bottom: 1px solid var(--surface); }
.modal-row:last-child { border-bottom: none; }
.modal-row-label { color: var(--text-2); }
.modal-row-value { color: var(--text); font-weight: 500; text-align: right; }
.modal-links { display: flex; gap: 8px; flex-wrap: wrap; }
.modal-link {
  display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px;
  border: 1px solid var(--border); border-radius: 6px; font-size: 12px;
  color: var(--text); text-decoration: none; background: var(--bg);
  transition: all 0.12s;
}
.modal-link:hover { border-color: var(--accent); background: var(--surface); }

.error-box {
  background: var(--red-bg); border: 1px solid var(--red-border);
  border-radius: 8px; padding: 10px 14px; font-size: 13px; color: var(--red);
}

.loading-row { display: flex; align-items: center; gap: 10px; color: var(--text-2); font-size: 13px; padding: 4px 0; }
.dots { display: flex; gap: 3px; }
.dot { width: 5px; height: 5px; background: var(--text-3); border-radius: 50%; animation: dotpulse 1.4s ease-in-out infinite; }
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes dotpulse {
  0%, 80%, 100% { opacity: 0.3; transform: scale(0.75); }
  40% { opacity: 1; transform: scale(1); }
}
.elapsed { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.load-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

#input-area {
  border-top: 1px solid var(--border); padding: 10px 12px;
  background: var(--bg); flex-shrink: 0;
}
#input-row {
  display: flex; gap: 6px; align-items: flex-end;
  border: 1px solid var(--border); border-radius: 12px;
  background: var(--bg); padding: 6px 8px;
  transition: border-color 0.12s;
}
#input-row:focus-within { border-color: var(--accent); }
#attach-btn {
  width: 30px; height: 30px; border: none; background: transparent;
  color: var(--text-3); cursor: pointer; border-radius: 6px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: color 0.12s, background 0.12s; align-self: flex-end; margin-bottom: 2px;
}
#attach-btn:hover { color: var(--text); background: var(--surface); }
#attach-btn.has-image { color: var(--accent); }
#attach-btn svg { width: 16px; height: 16px; }
#input {
  flex: 1; border: none; outline: none;
  padding: 4px 6px; font-size: 14px; font-family: inherit;
  resize: none; line-height: 1.45;
  min-height: 28px; max-height: 140px; overflow-y: auto;
  background: transparent; color: var(--text);
}
#input::placeholder { color: var(--text-3); }
#send-btn {
  width: 30px; height: 30px; background: var(--accent); color: #fff;
  border: none; border-radius: 7px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: background 0.12s; align-self: flex-end; margin-bottom: 2px;
}
#send-btn:hover:not(:disabled) { background: #333; }
#send-btn:disabled { background: var(--border-strong); cursor: not-allowed; }
#send-btn svg { width: 15px; height: 15px; }
#attach-preview {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 8px 0; font-size: 12px; color: var(--text-2);
}
#attach-preview span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#attach-preview button {
  border: none; background: none; color: var(--text-3); cursor: pointer;
  font-size: 14px; line-height: 1; padding: 0 2px;
}
#attach-preview button:hover { color: var(--text); }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
</style>
</head>
<body>
<div id="app">

  <div id="header">
    <span class="header-brand">Agent</span>
    <div class="header-spacer"></div>
    <select id="model-select"></select>
    <button class="icon-btn" id="new-chat-btn" title="New conversation">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </a>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>

          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>

<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script>
'use strict';

// ── Theme sync from parent window ──────────────────────────────────────────
(function() {
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t || 'light');
  }
  // Apply parent's current theme immediately (same origin)
  try { applyTheme(window.parent.document.documentElement.getAttribute('data-theme')); } catch(e) {}
  // Listen for theme changes posted from the parent
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'theme') applyTheme(e.data.value);
  });
})();

const API_URL  = '/api/agent-v2/chat/stream';
const LS_APIKEY    = 'dashboard-user-openrouter-key';
const LS_MODEL     = 'agent-model';
const LS_DEEPER    = 'agent-deeper';
const LS_AV_MODELS = 'dashboard-available-models';

// Default fallback models if none configured in settings
const DEFAULT_MODELS = [
  ['google/gemini-2.5-flash',      'Gemini 2.5 Flash'],
  ['google/gemini-2.5-pro',        'Gemini 2.5 Pro'],
  ['anthropic/claude-sonnet-4-5',  'Claude Sonnet 4.5'],
  ['anthropic/claude-opus-4-5',    'Claude Opus 4.5'],
  ['openai/gpt-4o',                'GPT-4o'],
  ['openai/gpt-4o-mini',           'GPT-4o mini'],
  ['x-ai/grok-3-mini',             'Grok 3 Mini'],
];

const SUGGESTIONS = [
  ['Best LLMs right now',    'What are the best LLMs right now?'],
  ['Best value models',      'Which model has the best quality-to-cost ratio?'],
  ['Top image generators',   'What are the top image generation models?'],
  ['Trending this week',     "What's trending in AI this week?"],
  ['Compare top models',     'Fetch the current LLM benchmarks and compare the top 3 models head to head'],
  ['Cheapest fast models',   'What are the cheapest fast LLMs?'],
];

let history = [];
let isLoading = false;
let timerInterval = null;
let startMs = 0;
let chartId = 0;

const $msgs    = document.getElementById('messages');
const $empty   = document.getElementById('empty-state');
const $input   = document.getElementById('input');
const $send    = document.getElementById('send-btn');
const $model   = document.getElementById('model-select');
const $apiKey  = document.getElementById('api-key-input');
const $deeper  = document.getElementById('deeper-mode');
const $settBar = document.getElementById('settings-bar');
const $attachBtn  = document.getElementById('attach-btn');
const $fileInput  = document.getElementById('file-input');
const $attachPrev = document.getElementById('attach-preview');
const $attachName = document.getElementById('attach-name');

let pendingImageDataUrl = null;

$attachBtn.addEventListener('click', () => $fileInput.click());
$fileInput.addEventListener('change', () => {
  const file = $fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    pendingImageDataUrl = e.target.result;
    $attachName.textContent = file.name;
    $attachPrev.style.display = 'flex';
    $attachBtn.classList.add('has-image');
  };
  reader.readAsDataURL(file);
  $fileInput.value = '';
});
document.getElementById('attach-remove').addEventListener('click', () => {
  pendingImageDataUrl = null;
  $attachPrev.style.display = 'none';
  $attachBtn.classList.remove('has-image');
});

// ── Build suggestion buttons via DOM to avoid innerHTML ──
(function buildSuggestions() {
  const wrap = document.getElementById('suggestions-wrap');
  SUGGESTIONS.forEach(([label, query]) => {
    const btn = document.createElement('button');
    btn.className = 'suggestion';
    btn.textContent = label;
    btn.addEventListener('click', () => { $input.value = query; $input.dispatchEvent(new Event('input')); send(); });
    wrap.appendChild(btn);
  });
})();

// ── Populate model select from dashboard settings ──
function populateModelSelect() {
  const raw = localStorage.getItem(LS_AV_MODELS) || '';
  const ids = raw.split(',').map(s => s.trim()).filter(Boolean);
  const pairs = ids.length > 0
    ? ids.map(id => [id, modelLabel(id)])
    : DEFAULT_MODELS;

  while ($model.firstChild) $model.removeChild($model.firstChild);
  pairs.forEach(([id, label]) => {
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = label;
    $model.appendChild(opt);
  });

  // Restore saved selection
  const saved = localStorage.getItem(LS_MODEL);
  if (saved && $model.querySelector('option[value="' + CSS.escape(saved) + '"]')) {
    $model.value = saved;
  }
}

function modelLabel(id) {
  // Convert openrouter-style IDs like "anthropic/claude-sonnet-4-5" → "Claude Sonnet 4.5"
  const part = id.includes('/') ? id.split('/').pop() : id;
  return part
    .replace(/-(\d)/g, ' $1')   // dash before digit → space
    .replace(/-/g, ' ')          // remaining dashes → spaces
    .replace(/\b\w/g, c => c.toUpperCase()); // title case
}

// ── Init ──
(function init() {
  populateModelSelect();
  $apiKey.value = localStorage.getItem(LS_APIKEY) || '';
  if (localStorage.getItem(LS_DEEPER) === 'true') $deeper.checked = true;
  updateSend();
})();

// ── Event delegation for model badges ──
$msgs.addEventListener('click', e => {
  const badge = e.target.closest('.model-badge[data-model-name]');
  if (badge) {
    openModelPage(badge.dataset.modelName, badge.dataset.modelSource || '');
  }
});

// ── Settings ──
document.getElementById('settings-toggle').addEventListener('click', () => $settBar.classList.toggle('hidden'));
document.getElementById('new-chat-btn').addEventListener('click', resetChat);

const inspectorLink = document.getElementById('agent-inspector-link');
if (inspectorLink) {
  const host = (window.location && window.location.hostname || '').toLowerCase();
  const localHosts = new Set(['localhost', '127.0.0.1', '::1']);
  const isPrivateNetwork = /^10\./.test(host) || /^192\.168\./.test(host) || /^172\.(1[6-9]|2\d|3[01])\./.test(host);
  if (!localHosts.has(host) && !isPrivateNetwork) {
    inspectorLink.style.display = 'none';
  }
}
$model.addEventListener('change', () => localStorage.setItem(LS_MODEL, $model.value));
$deeper.addEventListener('change', () => localStorage.setItem(LS_DEEPER, $deeper.checked));
$apiKey.addEventListener('input', () => localStorage.setItem(LS_APIKEY, $apiKey.value.trim()));

function getKey() {
  const v = $apiKey.value.trim();
  if (v) { localStorage.setItem(LS_APIKEY, v); return v; }
  return localStorage.getItem(LS_APIKEY) || '';
}

// ── Input ──
$input.addEventListener('input', () => {
  $input.style.height = 'auto';
  $input.style.height = Math.min($input.scrollHeight, 140) + 'px';
  updateSend();
});
$input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!isLoading) send(); }
});
$send.addEventListener('click', () => { if (!isLoading) send(); });
function updateSend() { $send.disabled = isLoading || !$input.value.trim(); }

function resetChat() {
  history = [];
  while ($msgs.firstChild) $msgs.removeChild($msgs.firstChild);
  $msgs.appendChild($empty);
  $empty.style.display = '';
}

// ── Send ──
async function send() {
  const text = $input.value.trim();
  if (!text || isLoading) return;

  const key = getKey();
  if (!key) {
    $settBar.classList.remove('hidden');
    $apiKey.focus();
    $apiKey.style.outline = '2px solid #dc2626';
    setTimeout(() => { $apiKey.style.outline = ''; }, 2000);
    return;
  }

  $empty.style.display = 'none';

  // Build message content — plain text or image+text array
  let userContent;
  if (pendingImageDataUrl) {
    userContent = [
      { type: 'image_url', image_url: { url: pendingImageDataUrl } },
      { type: 'text', text: text }
    ];
  } else {
    userContent = text;
  }
  history.push({ role: 'user', content: userContent });
  addUserMsg(text);

  // Clear attachment state
  if (pendingImageDataUrl) {
    pendingImageDataUrl = null;
    $attachPrev.style.display = 'none';
    $attachBtn.classList.remove('has-image');
  }

  $input.value = '';
  $input.style.height = 'auto';
  isLoading = true;
  updateSend();

  const loadEl = addLoading();
  startMs = Date.now();
  timerInterval = setInterval(() => {
    const el = loadEl.querySelector('.elapsed');
    if (el) el.textContent = fmtDur(Date.now() - startMs);
  }, 500);

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        settings: {
          api_key: key,
          model: $model.value,
          mode: $deeper.checked ? 'heavy' : 'quick',
          max_iterations: 200
        },
        messages: history
      })
    });

    if (!res.ok) {
      const t = await res.text();
      clearInterval(timerInterval);
      loadEl.remove();
      addError('HTTP ' + res.status + ': ' + t.slice(0, 200));
    } else {
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      const labelEl = loadEl.querySelector('.load-label');
      let buf = '';
      let toolCalls = [];
      loadEl.querySelector('.loading-row').addEventListener('click', () => openLiveTrace(toolCalls));

      outer: while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const parts = buf.split('\n\n');
        buf = parts.pop(); // keep incomplete trailing chunk

        for (const part of parts) {
          if (!part.startsWith('data: ')) continue;
          let evt;
          try { evt = JSON.parse(part.slice(6)); } catch (e) { continue; }

          if (evt.type === 'status') {
            const stage = evt.stage || '';
            if (labelEl) labelEl.textContent = stage === 'iteration_start' ? 'Thinking\u2026' : (stage.replace(/_/g, ' ') || 'Working\u2026');
          } else if (evt.type === 'tool_start') {
            const tc = { tool: evt.tool_name, args: evt.args || {}, status: 'running', result: '' };
            toolCalls.push(tc);
            if (labelEl) labelEl.textContent = (evt.tool_name || 'tool').replace(/_/g, ' ');
            if (isLiveTrace) {
              const el = buildSidebarStep(tc);
              $tsbBody.appendChild(el);
              liveTraceEls.push(el);
              $tsbBody.scrollTop = $tsbBody.scrollHeight;
            }
          } else if (evt.type === 'tool_result') {
            const revIdx = toolCalls.slice().reverse().findIndex(t => t.tool === evt.tool_name && t.status === 'running');
            const realIdx = revIdx >= 0 ? toolCalls.length - 1 - revIdx : -1;
            if (realIdx >= 0) {
              toolCalls[realIdx].status = evt.status || 'done';
              toolCalls[realIdx].result = evt.result_preview || '';
              if (isLiveTrace && liveTraceEls[realIdx]) {
                updateLiveStep(liveTraceEls[realIdx], toolCalls[realIdx]);
              }
            }
          } else if (evt.type === 'artifact') {
            if (evt.artifact) {
              openArtifactPanel(evt.artifact);
              addArtifactCard(evt.artifact);
            }
          } else if (evt.type === 'content_chunk') {
            if (labelEl) labelEl.textContent = 'Writing\u2026';
          } else if (evt.type === 'done') {
            const elapsed = Date.now() - startMs;
            clearInterval(timerInterval);
            loadEl.remove();
            if (isLiveTrace) {
              isLiveTrace = false;
              liveTraceEls = [];
              $tsbMeta.textContent = toolCalls.length + ' step' + (toolCalls.length !== 1 ? 's' : '') + ' \u00b7 ' + fmtDur(elapsed);
            }
            history.push({ role: 'assistant', content: evt.response || '' });
            addAgentMsg(evt.response || '', toolCalls, elapsed);
            break outer;
          } else if (evt.type === 'error') {
            clearInterval(timerInterval);
            loadEl.remove();
            isLiveTrace = false; liveTraceEls = [];
            addError(evt.error || 'Unknown error');
            break outer;
          }
        }
      }
    }
  } catch(e) {
    clearInterval(timerInterval);
    loadEl.remove();
    addError('Network error: ' + e.message);
  }

  isLoading = false;
  updateSend();
  scrollBot();
}

function addLoading() {

function addAgentMsg(responseText, toolCalls, elapsed) {
  const row = mk('div', 'msg-agent');

  if (toolCalls.length > 0) {
    // Trace pill
    const pill = mk('button', 'trace-pill');

    const chevron = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    chevron.setAttribute('viewBox', '0 0 24 24');
    chevron.setAttribute('fill', 'none');
    chevron.setAttribute('stroke', 'currentColor');
    chevron.setAttribute('stroke-width', '2');
    chevron.setAttribute('stroke-linecap', 'round');
    chevron.setAttribute('stroke-linejoin', 'round');
    chevron.classList.add('trace-chevron');
    const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    poly.setAttribute('points', '9 18 15 12 9 6');
    chevron.appendChild(poly);
    pill.appendChild(chevron);

    [
      'Activity', '·',
      toolCalls.length + ' step' + (toolCalls.length !== 1 ? 's' : ''),
      '·',
      fmtDur(elapsed)
    ].forEach(t => {
      const s = document.createElement('span');
      s.textContent = t;
      pill.appendChild(s);
    });

    const capturedCalls = toolCalls.slice();
    const capturedElapsed = elapsed;
    pill.addEventListener('click', () => openTraceSidebar(capturedCalls, capturedElapsed));

    row.appendChild(pill);
  }

  // Response — sanitize markdown output before inserting
  const resp = mk('div', 'agent-response');
  const rawHtml = renderMd(responseText);
  resp.innerHTML = (typeof DOMPurify !== 'undefined')
    ? DOMPurify.sanitize(rawHtml, {
        ADD_ATTR: ['data-cfg', 'data-model-name', 'data-model-source'],
        FORCE_BODY: false
      })
    : rawHtml;
  row.appendChild(resp);

  // Carousel: find all unique [[model:...]] references in the response
  const modelRefs = extractModelRefs(responseText);
  if (modelRefs.length > 0) {
    const carousel = buildCarousel(modelRefs);
    row.appendChild(carousel);
    fetchCarouselData(modelRefs, carousel);
  }

  $msgs.appendChild(row);
  renderCharts(resp);
}

const modelPageCache = {};  // key: "source:name" → page data

// ── Artifact state ────────────────────────────────────────────────────────────
let currentArtifact = null;
let artifactShowSource = false;
let artifactBlobUrl = null;

// ── Live trace state ──────────────────────────────────────────────────────────
let isLiveTrace = false;
let liveTraceEls = [];  // parallel array of DOM step elements

function extractModelRefs(text) {
  const refs = [];
  const seen = new Set();
  let m;
  // [[model:src:name]] format (preferred)
  const re = /\[\[model:([^:\]]+):([^\]]+)\]\]/g;
  while ((m = re.exec(text)) !== null) {
    const key = m[1] + ':' + m[2];
    if (!seen.has(key)) { seen.add(key); refs.push({ source: m[1], name: m[2] }); }
  }
  // Also handle raw HTML model-badge spans from models that ignore [[model:...]] format
  const reHtml = /<span\s+class="model-badge"\s+data-model-name="([^"]*)"\s+data-model-source="([^"]*)"/g;
  while ((m = reHtml.exec(text)) !== null) {
    const key = m[2] + ':' + m[1];
    if (!seen.has(key)) { seen.add(key); refs.push({ source: m[2], name: m[1] }); }
  }
  return refs;
}

function buildCarousel(refs) {
  const outer = mk('div', 'model-carousel-wrap');
  const wrap  = mk('div', 'model-carousel');

  refs.forEach(ref => {
    const card = mk('div', 'model-mini-card');
    card.dataset.source = ref.source;
    card.dataset.name   = ref.name;

    const nameEl = mk('div', 'model-mini-name');
    nameEl.textContent = ref.name;
    const srcEl = mk('div', 'model-mini-source');
    srcEl.textContent = ref.source;
    const bodyEl = mk('div', 'model-mini-loading');
    bodyEl.textContent = 'Loading\u2026';

    card.appendChild(nameEl);
    card.appendChild(srcEl);
    card.appendChild(bodyEl);
    card.addEventListener('click', () => openModelPage(ref.name, ref.source));
    wrap.appendChild(card);
  });

  // Pagination arrows
  const btnL = mk('button', 'carousel-arrow left');
  btnL.textContent = '\u2039';
  btnL.title = 'Scroll left';
  const btnR = mk('button', 'carousel-arrow right');
  btnR.textContent = '\u203a';
  btnR.title = 'Scroll right';

  const scrollAmt = () => Math.max(180, wrap.clientWidth * 0.7);
  btnL.addEventListener('click', () => wrap.scrollBy({ left: -scrollAmt(), behavior: 'smooth' }));
  btnR.addEventListener('click', () => wrap.scrollBy({ left:  scrollAmt(), behavior: 'smooth' }));

  function updateArrows() {
    const atStart = wrap.scrollLeft <= 4;
    const atEnd   = wrap.scrollLeft + wrap.clientWidth >= wrap.scrollWidth - 4;
    btnL.classList.toggle('visible', !atStart);
    btnR.classList.toggle('visible', !atEnd);
  }
  wrap.addEventListener('scroll', updateArrows, { passive: true });
  setTimeout(updateArrows, 120);

  outer.appendChild(btnL);
  outer.appendChild(wrap);
  outer.appendChild(btnR);
  return outer;
}

function fetchCarouselData(refs, carousel) {
  refs.forEach(ref => {
    const key = ref.source + ':' + ref.name;
    if (modelPageCache[key]) {
      updateCarouselCard(carousel, ref, modelPageCache[key]);
      return;
    }
    const apiKey = getKey();
    if (!apiKey) return;
    fetch('/api/model-page', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model_name: ref.name, source: ref.source, api_key: apiKey })
    })
    .then(r => r.json())
    .then(data => {
      modelPageCache[key] = data;
      updateCarouselCard(carousel, ref, data);
    })
    .catch(() => {
      updateCarouselCard(carousel, ref, null);
    });
  });
}

function updateCarouselCard(carousel, ref, data) {
  const esc = s => s.replace(/['"\\]/g, '\\$&');
  const card = [...carousel.querySelectorAll('.model-mini-card')].find(
    c => c.dataset.source === ref.source && c.dataset.name === ref.name
  );
  if (!card) return;
  const bodyEl = card.querySelector('.model-mini-loading, .model-mini-summary');
  if (!bodyEl) return;
  bodyEl.className = 'model-mini-summary';
  bodyEl.textContent = (data && !data.error && data.summary) ? data.summary : 'No data available.';
}

function openModelPage(name, source) {
  const overlay = document.getElementById('model-modal-overlay');
  const title   = document.getElementById('modal-model-name');
  const body    = document.getElementById('modal-body');

  title.textContent = name;
  while (body.firstChild) body.removeChild(body.firstChild);

  const loadingEl = mk('div', 'model-mini-loading');
  loadingEl.textContent = 'Loading model data\u2026';
  body.appendChild(loadingEl);
  overlay.classList.add('open');

  const key = (source || '') + ':' + name;
  if (modelPageCache[key]) {
    renderModelModal(body, modelPageCache[key]);
    return;
  }

  const apiKey = getKey();
  fetch('/api/model-page', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model_name: name, source: source || '', api_key: apiKey })
  })
  .then(r => r.json())
  .then(data => {
    modelPageCache[key] = data;
    renderModelModal(body, data);
  })
  .catch(e => {
    while (body.firstChild) body.removeChild(body.firstChild);
    const err = mk('div', 'error-box');
    err.textContent = 'Failed to load: ' + e.message;
    body.appendChild(err);
  });
}

function renderModelModal(body, data) {
  while (body.firstChild) body.removeChild(body.firstChild);

  if (data.error) {
    const err = mk('div', 'error-box');
    err.textContent = data.error;
    body.appendChild(err);
    return;
  }

  // Summary
  if (data.summary) {
    const s = mk('p', 'modal-summary');
    s.textContent = data.summary;
    body.appendChild(s);
  }

  // Key facts
  if (data.key_facts && data.key_facts.length > 0) {
    const sec = mk('div', 'modal-section');
    const h = mk('div', 'modal-section-title'); h.textContent = 'Key Facts';
    sec.appendChild(h);
    const ul = mk('ul');
    ul.style.cssText = 'padding-left:16px;margin:0;display:flex;flex-direction:column;gap:3px';
    data.key_facts.forEach(fact => {
      const li = document.createElement('li');
      li.style.cssText = 'font-size:12px;color:var(--text-2);line-height:1.6';
      li.textContent = fact;
      ul.appendChild(li);
    });
    sec.appendChild(ul);
    body.appendChild(sec);
  }

  // OpenRouter data
  const orData = data.or_data;
  if (orData) {
    const sec = mk('div', 'modal-section');
    const h = mk('div', 'modal-section-title'); h.textContent = 'OpenRouter';
    sec.appendChild(h);
    const pricing = orData.pricing || {};
    [
      ['Input cost',  pricing.prompt     ? '$' + (parseFloat(pricing.prompt)     * 1e6).toFixed(2) + '/1M' : null],
      ['Output cost', pricing.completion ? '$' + (parseFloat(pricing.completion) * 1e6).toFixed(2) + '/1M' : null],
      ['Context',     orData.context_length ? orData.context_length.toLocaleString() + ' tokens' : null],
      ['Model ID',    data.or_id || orData.id || null],
    ].forEach(([label, val]) => { if (val) sec.appendChild(modalDataRow(label, val)); });
    if (orData.description) {
      const desc = mk('p');
      desc.style.cssText = 'font-size:12px;color:var(--text-2);line-height:1.6;margin-top:6px';
      desc.textContent = orData.description.slice(0, 400) + (orData.description.length > 400 ? '\u2026' : '');
      sec.appendChild(desc);
    }
    body.appendChild(sec);
  }

  // AA benchmarks
  const aaData = data.aa_data;
  if (aaData) {
    const sec = mk('div', 'modal-section');
    const h = mk('div', 'modal-section-title'); h.textContent = 'Artificial Analysis';
    sec.appendChild(h);
    const ev  = aaData.evaluations || {};
    const spd = aaData.median_output_tokens_per_second;
    const qi  = ev.artificial_analysis_intelligence_index;
    [
      ['Intelligence index', qi  ? parseFloat(qi).toFixed(0)  : null],
      ['Speed',              spd ? parseFloat(spd).toFixed(0) + ' tok/s' : null],
    ].forEach(([label, val]) => { if (val) sec.appendChild(modalDataRow(label, val)); });
    body.appendChild(sec);
  }

  // Monitor hits
  const hits = data.monitor_hits;
  if (hits && hits.length > 0) {
    const sec = mk('div', 'modal-section');
    const h = mk('div', 'modal-section-title'); h.textContent = 'In the news';
    sec.appendChild(h);
    hits.forEach(hit => {
      if (!hit.title) return;
      const row = mk('div');
      row.style.cssText = 'font-size:12px;color:var(--text-2);padding:3px 0;line-height:1.5';
      if (hit.url) {
        const a = document.createElement('a');
        a.href = hit.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
        a.style.cssText = 'color:var(--blue);text-decoration:none';
        a.textContent = hit.title;
        a.addEventListener('mouseover', () => { a.style.textDecoration = 'underline'; });
        a.addEventListener('mouseout',  () => { a.style.textDecoration = 'none'; });
        row.appendChild(a);
      } else {
        row.textContent = hit.title;
      }
      sec.appendChild(row);
    });
    body.appendChild(sec);
  }

  // External links
  const linkPairs = [];
  if (data.or_link) linkPairs.push(['OpenRouter', data.or_link]);
  if (data.aa_link) linkPairs.push(['Artificial Analysis', data.aa_link]);
  if (linkPairs.length > 0) {
    const linkSec = mk('div', 'modal-links');
    linkPairs.forEach(([label, url]) => {
      const a = document.createElement('a');
      a.className = 'modal-link';
      a.textContent = '\u2197 ' + label;
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      linkSec.appendChild(a);
    });
    body.appendChild(linkSec);
  }
}

    case 'flame':   return svg([

// ── Markdown rendering ──
function renderMd(text) {
  if (!text) return '';

  // Normalize any raw HTML model-badge spans (from models that output HTML instead of
  // [[model:...]] syntax) back to [[model:...]] format before marked.parse runs.
  // This prevents marked.js from escaping the HTML in GFM table cells.
  text = text.replace(/<span\s+class="model-badge"\s+data-model-name="([^"]*)"\s+data-model-source="([^"]*)">(?:[^<]*)<\/span>/g,
    (_m, name, source) => `[[model:${source}:${name}]]`
  );

  let html = marked.parse(text, { breaks: true, gfm: true });

  // Replace chart code blocks with canvas placeholders.
  // Supports flat format (labels+datasets at root), nested format (data.datasets),
  // and scatter charts (datasets only, no labels required).
  html = html.replace(/<pre><code[^>]*>([\s\S]*?)<\/code><\/pre>/g, (match, inner) => {
    const decoded = inner
      .replace(/&quot;/g, '"').replace(/&amp;/g, '&')
      .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&#39;/g, "'").trim();
    try {
      const obj = JSON.parse(decoded);
      const datasets = obj.datasets || (obj.data && obj.data.datasets);
      if (obj && obj.type && datasets) {
        const id = 'chart-' + (++chartId);
        // Normalize to flat format; carry scales from options for log-scale support
        const flat = {
          type: obj.type,
          labels: obj.labels || (obj.data && obj.data.labels) || [],
          datasets: datasets,
          scales: (obj.options && obj.options.scales) || null
        };
        const safe = JSON.stringify(flat).replace(/"/g, '&quot;');
        return '<div class="chart-wrap"><canvas id="' + id + '" data-cfg="' + safe + '"></canvas></div>';
      }
    } catch(e) { /* not a chart */ }
    return match;
  });

  // Convert [[model:src:name]] to clickable badges AFTER marked.parse so the
  // resulting <span> tags are not escaped when they appear inside GFM table cells.
  html = html.replace(/\[\[model:([^:\]]+):([^\]]+)\]\]/g, (_m, src, name) => {
    const safeName = name.replace(/[<>"'&]/g, c => ({'<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','&':'&amp;'}[c]));
    const safeSrc  = src.replace(/[<>"'&]/g, c => ({'<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','&':'&amp;'}[c]));
    return `<span class="model-badge" data-model-name="${safeName}" data-model-source="${safeSrc}">${safeName}</span>`;
  });

  return html;
}

// Strip arrow-function strings from chart options (JSON can't hold real functions)
function _stripFnStrings(obj) {
  if (typeof obj === 'string') return /=>/.test(obj) ? undefined : obj;
  if (Array.isArray(obj)) { const r = obj.map(_stripFnStrings).filter(v => v !== undefined); return r.length ? r : undefined; }
  if (obj && typeof obj === 'object') {
    const r = {};
    for (const [k, v] of Object.entries(obj)) { const c = _stripFnStrings(v); if (c !== undefined) r[k] = c; }
    return Object.keys(r).length ? r : undefined;
  }
  return obj;
}

function renderCharts(container) {
  container.querySelectorAll('canvas[data-cfg]').forEach(cv => {
    try {
      const cfg = JSON.parse(cv.getAttribute('data-cfg'));
      const isScatter = cfg.type === 'scatter';
      const isPie = cfg.type === 'pie' || cfg.type === 'doughnut';

      // Build scales: use cfg.scales (from options.scales in model output) if provided,
      // else fall back to sensible defaults. Strip any callback function strings.
      let scales;
      if (isPie) {
        scales = {};
      } else if (cfg.scales) {
        const cleaned = _stripFnStrings(cfg.scales) || {};
        // Merge visual defaults into each axis
        for (const axis of ['x', 'y']) {
          if (cleaned[axis]) {
            cleaned[axis].ticks = Object.assign({ font: { size: 11 }, color: '#6b7280' }, cleaned[axis].ticks || {});
            cleaned[axis].grid  = cleaned[axis].grid  || { color: '#f3f4f6' };
          }
        }
        scales = cleaned;
      } else {
        scales = {
          x: { ticks: { font: { size: 11 }, color: '#6b7280', maxRotation: 30 }, grid: { color: '#f3f4f6' } },
          y: { ticks: { font: { size: 11 }, color: '#6b7280' }, grid: { color: '#f3f4f6' } }
        };
      }

      new Chart(cv, {
        type: cfg.type || 'bar',
        data: {
          labels: cfg.labels || [],
          datasets: (cfg.datasets || []).map((ds, i) => {
            const rawData = ds.data || [];
            // Normalize scatter data: [[x,y]] array-of-arrays -> {x,y} objects
            const data = isScatter
              ? rawData.map(pt => Array.isArray(pt) ? { x: pt[0], y: pt[1] } : pt)
              : rawData;
            const d = {
              label: ds.label || '',
              data,
              backgroundColor: ds.backgroundColor || palette(i, isScatter ? 0.8 : 0.7),
              borderColor: ds.borderColor || palette(i, 1),
              borderWidth: ds.borderWidth != null ? ds.borderWidth : 1,
            };
            if (isScatter) { d.pointRadius = 5; d.pointHoverRadius = 7; }
            return d;
          })
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { labels: { font: { size: 11, family: 'system-ui' }, color: '#374151' } },
            tooltip: isScatter ? {
              callbacks: {
                label: ctx => {
                  const r = ctx.raw;
                  const name = r.label || r.name || '';
                  return name ? name + ' (' + r.x + ', ' + r.y + ')' : '(' + r.x + ', ' + r.y + ')';
                }
              }
            } : {}
          },
          scales
        }
      });
    } catch(e) { console.warn('Chart render error', e); }
  });
}

function palette(i, a) {
  const c = [
    'rgba(37,99,235,'+a+')', 'rgba(16,185,129,'+a+')', 'rgba(245,158,11,'+a+')',
    'rgba(239,68,68,'+a+')',  'rgba(139,92,246,'+a+')', 'rgba(236,72,153,'+a+')'
  ];
  if (typeof i === 'number') return c[i % c.length];
  return (i || []).map((_,idx) => c[idx % c.length]);
}

// ── Trace Sidebar ───────────────────────────────────────────────────────────
const $tsbPanel    = document.getElementById('tsb-panel');
const $tsbBackdrop = document.getElementById('tsb-backdrop');
const $tsbBody     = document.getElementById('tsb-body');
const $tsbMeta     = document.getElementById('tsb-meta');

document.getElementById('tsb-close').addEventListener('click', closeTraceSidebar);
$tsbBackdrop.addEventListener('click', closeTraceSidebar);

function openTraceSidebar(toolCalls, elapsed) {
  while ($tsbBody.firstChild) $tsbBody.removeChild($tsbBody.firstChild);
  $tsbMeta.textContent = toolCalls.length + ' step' + (toolCalls.length !== 1 ? 's' : '') + ' \u00b7 ' + fmtDur(elapsed);
  if (toolCalls.length === 0) {
    const empty = mk('div', 'tsb-empty');
    empty.textContent = 'No activity recorded.';
    $tsbBody.appendChild(empty);
  } else {
    toolCalls.forEach(tc => $tsbBody.appendChild(buildSidebarStep(tc)));
  }
  $tsbPanel.classList.add('open');
  $tsbBackdrop.classList.add('open');
}

function closeTraceSidebar() {
  $tsbPanel.classList.remove('open');
  $tsbBackdrop.classList.remove('open');
  isLiveTrace = false;
  liveTraceEls = [];
}

// Open trace sidebar in live mode during streaming
function openLiveTrace(toolCallsRef) {
  while ($tsbBody.firstChild) $tsbBody.removeChild($tsbBody.firstChild);
  while ($tsbMeta.firstChild) $tsbMeta.removeChild($tsbMeta.firstChild);
  const liveTag = mk('span', 'tsb-head-live');
  liveTag.textContent = 'Live';
  $tsbMeta.appendChild(liveTag);
  liveTraceEls = [];
  toolCallsRef.forEach(tc => {
    const el = buildSidebarStep(tc);
    $tsbBody.appendChild(el);
    liveTraceEls.push(el);
  });
  isLiveTrace = true;
  $tsbPanel.classList.add('open');
  $tsbBackdrop.classList.add('open');
}

// Update a live step element's dot/badge/detail when tool_result arrives
function updateLiveStep(el, tc) {
  const dot = el.querySelector('.tsb-dot');
  if (dot) dot.className = tc.status === 'error' ? 'tsb-dot err' : 'tsb-dot done';
  const rowMain = el.querySelector('.tsb-row-main');
  if (rowMain) {
    let badge = rowMain.querySelector('.tsb-badge');
    if (!badge) {
      badge = mk('span', tc.status === 'error' ? 'tsb-badge err' : 'tsb-badge');
      const chev = rowMain.querySelector('.tsb-chevron');
      if (chev) rowMain.insertBefore(badge, chev); else rowMain.appendChild(badge);
    } else {
      badge.className = tc.status === 'error' ? 'tsb-badge err' : 'tsb-badge';
    }
    badge.textContent = tc.status;
  }
  const detail = el.querySelector('.tsb-detail');
  if (detail && tc.result) {
    const parts = [];
    if (tc.args && Object.keys(tc.args).length > 0) parts.push('Args: ' + JSON.stringify(tc.args, null, 2));
    if (tc.result) parts.push(tc.result);
    detail.textContent = parts.join('\n\n') || 'No detail available.';
  }
}

// ── Artifact Panel ────────────────────────────────────────────────────────────
const $artifactBackdrop  = document.getElementById('artifact-backdrop');
const $artifactPanel     = document.getElementById('artifact-panel');
const $artifactBody      = document.getElementById('artifact-body');
const $artifactTypeBadge = document.getElementById('artifact-type-badge');
const $artifactTitleEl   = document.getElementById('artifact-title-el');
const $artifactSourceBtn = document.getElementById('artifact-source-btn');
const $artifactCopyBtn   = document.getElementById('artifact-copy-btn');
const $artifactDownloadBtn = document.getElementById('artifact-download-btn');

document.getElementById('artifact-close').addEventListener('click', closeArtifactPanel);
$artifactBackdrop.addEventListener('click', closeArtifactPanel);

function closeArtifactPanel() {
  $artifactPanel.classList.remove('open');
  $artifactBackdrop.classList.remove('open');
}

function openArtifactPanel(artifactData) {
  currentArtifact = artifactData;
  artifactShowSource = false;
  $artifactTypeBadge.textContent = artifactData.artifact_type || 'code';
  $artifactTitleEl.textContent = artifactData.title || 'Artifact';
  renderArtifactContent();
  $artifactPanel.classList.add('open');
  $artifactBackdrop.classList.add('open');
}

function renderArtifactContent() {
  while ($artifactBody.firstChild) $artifactBody.removeChild($artifactBody.firstChild);
  if (!currentArtifact) return;
  const type = currentArtifact.artifact_type || 'code';
  const content = currentArtifact.content || '';
  $artifactSourceBtn.classList.toggle('active', artifactShowSource);

  if (artifactShowSource) {
    const pre = mk('div', 'artifact-source-view');
    pre.textContent = content;
    $artifactBody.appendChild(pre);
    return;
  }

  if (type === 'html') {
    const iframe = document.createElement('iframe');
    iframe.className = 'artifact-iframe';
    iframe.sandbox = 'allow-scripts allow-forms allow-downloads allow-modals';
    if (artifactBlobUrl) URL.revokeObjectURL(artifactBlobUrl);
    artifactBlobUrl = URL.createObjectURL(new Blob([content], { type: 'text/html' }));
    iframe.src = artifactBlobUrl;
    $artifactBody.appendChild(iframe);
  } else if (type === 'markdown') {
    const div = mk('div', 'artifact-markdown-view agent-response');
    const rawHtml = renderMd(content);
    div.innerHTML = (typeof DOMPurify !== 'undefined') ? DOMPurify.sanitize(rawHtml, { ADD_ATTR: ['data-cfg'] }) : rawHtml;
    $artifactBody.appendChild(div);
    renderCharts(div);
  } else if (type === 'svg') {
    const div = mk('div', 'artifact-svg-view');
    const safeSvg = (typeof DOMPurify !== 'undefined')
      ? DOMPurify.sanitize(content, { USE_PROFILES: { svg: true, svgFilters: true } }) : '';
    div.innerHTML = safeSvg;
    $artifactBody.appendChild(div);
  } else if (type === 'chart') {
    const wrap = mk('div', 'artifact-chart-wrap');
    const canvas = document.createElement('canvas');
    wrap.appendChild(canvas);
    $artifactBody.appendChild(wrap);
    try {
      const cfg = JSON.parse(content);
      const pal = (i, a) => ['rgba(37,99,235,','rgba(16,185,129,','rgba(245,158,11,','rgba(239,68,68,','rgba(139,92,246,'][i % 5] + a + ')';
      new Chart(canvas, {
        type: cfg.type || 'bar',
        data: {
          labels: cfg.labels || [],
          datasets: (cfg.datasets || []).map((ds, i) => ({
            label: ds.label || '', data: ds.data || [],
            backgroundColor: ds.backgroundColor || pal(i, 0.7),
            borderColor: ds.borderColor || pal(i, 1), borderWidth: 1
          }))
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    } catch(e) { wrap.textContent = 'Invalid chart config: ' + e.message; }
  } else {
    const pre = mk('div', 'artifact-source-view');
    pre.textContent = content;
    $artifactBody.appendChild(pre);
  }
}

$artifactSourceBtn.addEventListener('click', () => {
  if (!currentArtifact) return;
  artifactShowSource = !artifactShowSource;
  renderArtifactContent();
});

$artifactCopyBtn.addEventListener('click', () => {
  if (!currentArtifact) return;
  navigator.clipboard.writeText(currentArtifact.content || '').then(() => {
    $artifactCopyBtn.textContent = 'Copied!';
    $artifactCopyBtn.classList.add('success');
    setTimeout(() => { $artifactCopyBtn.textContent = 'Copy'; $artifactCopyBtn.classList.remove('success'); }, 1500);
  }).catch(() => {});
});

$artifactDownloadBtn.addEventListener('click', () => {
  if (!currentArtifact) return;
  const type = currentArtifact.artifact_type || 'code';
  const safeName = (currentArtifact.title || 'artifact').replace(/[^a-z0-9\-_]/gi, '_').toLowerCase();

  if (type === 'chart' && !artifactShowSource) {
    // Export rendered chart as PNG from canvas
    const canvas = $artifactBody.querySelector('canvas');
    if (canvas) {
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = safeName + '.png';
      a.click();
      return;
    }
  }

  const extMap = { html: 'html', markdown: 'md', svg: 'svg', chart: 'json', code: currentArtifact.language || 'txt' };
  const ext = extMap[type] || 'txt';
  const url = URL.createObjectURL(new Blob([currentArtifact.content || ''], { type: 'text/plain' }));
  const a = document.createElement('a');
  a.href = url; a.download = safeName + '.' + ext; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
});

// Inline artifact reference — subtle text link, whole card is clickable
function addArtifactCard(artifact) {
  const row = mk('div', 'msg-agent');
  const card = mk('button', 'artifact-card');
  card.type = 'button';

  // Document icon
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('width', '13'); svg.setAttribute('height', '13');
  svg.setAttribute('viewBox', '0 0 24 24'); svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor'); svg.setAttribute('stroke-width', '2');
  svg.setAttribute('stroke-linecap', 'round'); svg.setAttribute('stroke-linejoin', 'round');
  svg.classList.add('artifact-card-icon');
  const p1 = document.createElementNS(ns, 'path');
  p1.setAttribute('d', 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z');
  const p2 = document.createElementNS(ns, 'polyline'); p2.setAttribute('points', '14 2 14 8 20 8');
  svg.appendChild(p1); svg.appendChild(p2);

  const typeEl = mk('span', 'artifact-card-type');
  typeEl.textContent = artifact.artifact_type || 'code';

  const titleEl = mk('span', 'artifact-card-title');
  titleEl.textContent = artifact.title || 'Artifact';

  card.appendChild(svg);
  card.appendChild(typeEl);
  card.appendChild(titleEl);

  card.addEventListener('click', () => {
    currentArtifact = artifact;
    artifactShowSource = false;
    $artifactTypeBadge.textContent = artifact.artifact_type || 'code';
    $artifactTitleEl.textContent = artifact.title || 'Artifact';
    renderArtifactContent();
    $artifactPanel.classList.add('open');
    $artifactBackdrop.classList.add('open');
  });

  row.appendChild(card);
  $msgs.appendChild(row);
  scrollBot();
}

function buildSidebarStep(tc) {
  const info = toolInfo(tc.tool, tc.args);
  const div = mk('div', 'tsb-step');

  // Gutter + dot
  const gutter = mk('div', 'tsb-gutter');
  const dotCls = tc.status === 'error' ? 'tsb-dot err' : tc.status === 'done' ? 'tsb-dot done' : 'tsb-dot running';
  const dot = mk('div', dotCls);
  gutter.appendChild(dot);

  // Content
  const content = mk('div', 'tsb-content');

  const rowMain = mk('div', 'tsb-row-main');
  const name = mk('span', 'tsb-name');
  name.textContent = info.label;

  if (tc.status && tc.status !== 'running') {
    const badge = mk('span', tc.status === 'error' ? 'tsb-badge err' : 'tsb-badge');
    badge.textContent = tc.status;
    rowMain.appendChild(name);
    rowMain.appendChild(badge);
  } else {
    rowMain.appendChild(name);
  }

  // Chevron
  const ns = 'http://www.w3.org/2000/svg';
  const chSvg = document.createElementNS(ns, 'svg');
  chSvg.setAttribute('viewBox', '0 0 24 24');
  chSvg.setAttribute('fill', 'none');
  chSvg.setAttribute('stroke', 'currentColor');
  chSvg.setAttribute('stroke-width', '2');
  chSvg.setAttribute('stroke-linecap', 'round');
  chSvg.setAttribute('stroke-linejoin', 'round');
  chSvg.classList.add('tsb-chevron');
  const chPoly = document.createElementNS(ns, 'polyline');
  chPoly.setAttribute('points', '9 18 15 12 9 6');
  chSvg.appendChild(chPoly);
  rowMain.appendChild(chSvg);

  content.appendChild(rowMain);

  if (info.sub) {
    const sub = mk('div', 'tsb-sub');
    sub.textContent = info.sub;
    content.appendChild(sub);
  }

  // Detail
  const detail = mk('div', 'tsb-detail');
  const parts = [];
  if (tc.args && Object.keys(tc.args).length > 0) {
    parts.push('Args: ' + JSON.stringify(tc.args, null, 2));
  }
  if (tc.result) {
    parts.push(tc.result);
  }
  detail.textContent = parts.join('\n\n') || 'No detail available.';
  content.appendChild(detail);

  div.appendChild(gutter);
  div.appendChild(content);

  div.addEventListener('click', () => div.classList.toggle('open'));
  return div;
}

function fmtDur(ms) {
  const s = Math.floor(ms / 1000);
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60), r = s % 60;
  return r > 0 ? m + 'm ' + r + 's' : m + 'm';
}

function scrollBot() {
  requestAnimationFrame(() => { $msgs.scrollTop = $msgs.scrollHeight; });
}
</script>
